version: 2
updates:
  # Versions of the actions used in .github/workflows/*.yml.
  #
  # Grouped deliberately: a runtime-wide move like the Node 20 -> 24
  # migration touches every action at once, and ungrouped that arrives as
  # one PR per action. As a single PR it is one review and one merge, and
  # the workflows never sit half-migrated between merges.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # requirements.txt and pyproject.toml, which list the same packages.
  #
  # Split into two groups. The other packages are ordinary upgrades. wxPython
  # is the UI toolkit, and a wx bump changes what a screen reader hears, so it
  # gets a PR of its own that someone drives the app with before merging,
  # instead of riding along with routine patches. theideaplace-appkit is
  # pinned to an app-kit commit by URL, so Dependabot leaves it alone.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      wxpython:
        patterns:
          - "wxPython*"
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "wxPython*"

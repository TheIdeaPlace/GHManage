name: GHManage

# Every v* tag publishes one GitHub release carrying both platforms: the
# Windows installer/portable/feed and the macOS .pkg/.dmg/portable/feed.
#
# The three jobs are deliberately split. build-windows and build-macos run in
# parallel and only build; a separate release job publishes what they produce.
# That is what makes a release atomic across platforms — the previous
# single-job layout created the release from inside the Windows job, so there
# was no point at which "both platforms succeeded" could be checked before
# publishing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token azure/login exchanges for Azure creds (signing)

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  Windows
  # ══════════════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    # This pins the OIDC token subject to
    # repo:TheIdeaPlace@340125137/GHManage@1295265237:environment:azure-signing (numeric-id form; moved from kellylford on 2026-10-10), which is the string
    # the Azure federated credential has to trust — the tenant does not support
    # wildcard tag subjects. It is ONLY a claim-matching mechanism, not a
    # deployment gate; the environment must stay unprotected or every build,
    # including PRs, will wait for approval.
    environment: azure-signing

    # Surfaced as an env var so steps can test whether signing is configured.
    # Secrets cannot be referenced directly in an `if:` expression.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Before anything is built or signed, so a failing test stops a release
      # rather than shipping it. Nothing here touches GitHub: gh is faked.
      - name: Run tests
        run: |
          pip install "pytest>=8,<10"
          python -m pytest -q -rs

      # The release tag is the source of truth, but the app reports version.py.
      # If they disagree the updater compares against a lie, so fail early.
      - name: Verify tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $app = python -c "from version import __version__; print(__version__)"
          Write-Host "tag=$tag version.py=$app"
          if ($tag -ne $app) {
            Write-Error "Tag v$tag does not match version.py ($app). Bump version.py and re-tag."
            exit 1
          }

      # Help ▸ Report a Bug sends through The Idea Place's shared relay with
      # this app's key. Releases only: the key is a secret, and a build from a
      # pull request or a fork has none, so its reports fall back to GitHub's
      # new issue page. A release without them fails here.
      - name: Write bug-report relay config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPKIT_RELAY_URL: ${{ vars.APPKIT_RELAY_URL }}
          APPKIT_RELAY_KEY: ${{ secrets.APPKIT_RELAY_KEY }}
        run: python scripts/write_relay_config.py

      # --onedir, not --onefile: Velopack swaps an app folder in place. A
      # onefile exe re-extracts ~17MB on every launch, which overruns
      # Velopack's 15s update-hook timeout and makes deltas worthless.
      # --hidden-import velopack: updater.py imports it lazily inside
      # functions, so PyInstaller's static analysis cannot see it. Same for
      # yaml, which gh_data imports inside _parse_dispatch_spec — without it
      # the packaged build raises ModuleNotFoundError the moment someone runs
      # a workflow, which no CI step would catch.
      - name: Build application
        run: |
          python assets/make_version_info.py
          pyinstaller --noconsole --onedir --name ghmanage `
            --icon assets/ghmanage.ico `
            --version-file build/version_info.txt `
            --hidden-import velopack --hidden-import yaml ghviewer.py -y

      - name: Install vpk
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      # Fetch the previous release's packages so vpk can build a delta against
      # them. Expected to fail on the very first Velopack release.
      - name: Download previous release packages
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: >
          vpk download github
          --repoUrl https://github.com/TheIdeaPlace/GHManage
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir installer/Releases

      # --- Code signing (Azure Trusted Signing via GitHub OIDC) --------------
      # azure/login exchanges the workflow OIDC token for Azure credentials;
      # Velopack's bundled signtool then authenticates through that `az` session
      # (DefaultAzureCredential). No certificate or long-lived secret is stored.
      #
      # Signing is skipped when AZURE_CLIENT_ID is unset, so releases keep
      # working unsigned until the Azure federated credential for this repo
      # exists. Unsigned builds update fine; signing only removes the
      # SmartScreen "unknown publisher" warning.
      - name: Azure login (code signing)
        if: startsWith(github.ref, 'refs/tags/v') && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # UTF-8 without BOM is required by Velopack's --azureTrustedSignFile
      # reader; [IO.File]::WriteAllText writes exactly that.
      - name: Write signing metadata
        if: startsWith(github.ref, 'refs/tags/v') && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $json = @{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'kellylford'
            CertificateProfileName = 'kellyford-public'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\signing-metadata.json", $json)

      # --azureTrustedSignFile signs the packaged app binaries and Velopack's
      # own Update.exe / Setup.exe, so the portable zip and the installer are
      # both signed from this one invocation.
      - name: Pack Velopack installer and update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $signArgs = @()
          $meta = "$env:GITHUB_WORKSPACE\signing-metadata.json"
          if (Test-Path $meta) {
            Write-Host "Signing with Azure Trusted Signing."
            $signArgs = @('--azureTrustedSignFile', $meta)
          } else {
            Write-Host "::warning::AZURE_CLIENT_ID not set - producing UNSIGNED build."
          }
          vpk pack --packId GHManage --packVersion $version `
            --packDir dist/ghmanage --mainExe ghmanage.exe `
            --packTitle "GHManage" --packAuthors "Kelly Ford" `
            --icon assets/ghmanage.ico `
            --outputDir installer/Releases `
            --instLocation PerUser --shortcuts StartMenuRoot `
            --releaseNotes docs/release-notes-${{ github.ref_name }}.md `
            @signArgs
          # The previous version's full .nupkg (fetched above as the delta input)
          # stays in the folder and is uploaded with the rest. It is tempting to
          # delete it as "not this release's asset", but `vpk pack` writes an
          # entry for every package it saw into RELEASES/releases.win.json — so
          # removing the file publishes feed metadata that references an asset
          # the release does not carry. v0.4.0 shipped that way and its feed
          # still points at GHManage-0.3.0-full.nupkg; harmless for the delta
          # path, but not something to keep doing.
          Get-ChildItem installer/Releases | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghmanage-win-x64
          path: dist/ghmanage/**
          if-no-files-found: error
          retention-days: 7

      # Handed to the release job. RELEASES, releases.win.json and
      # assets.win.json are the update feed — the in-app updater reads them to
      # discover new versions. A release missing them strands every installed
      # client silently, so they are required, not extras.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            installer/Releases/GHManage-win-Setup.exe
            installer/Releases/GHManage-win-Portable.zip
            installer/Releases/*.nupkg
            installer/Releases/RELEASES
            installer/Releases/releases.win.json
            installer/Releases/assets.win.json
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
  #  macOS (Apple Silicon)
  # ══════════════════════════════════════════════════════════════════════
  #
  # Apple Silicon only, by decision. wxPython and velopack both publish
  # per-architecture wheels and no universal2 build, so an Intel release would
  # mean a second matrix leg on the deprecated macos-13 runner rather than a
  # fat binary. See docs/INSTALLER.md.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Signing and notarization each switch on only when their full set of
      # secrets exists. Missing secrets mean an ad-hoc signed build and a green
      # run, never a failure on credentials that were never configured — the
      # same gating shape as AZURE_CLIENT_ID on the Windows job.
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      MACOS_NOTARIZE_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
      # The keychain path is NOT set here. The `runner` context is not available
      # in a job-level env block (only github/needs/secrets/vars/inputs are), so
      # ${{ runner.temp }} would expand to an empty string and every keychain
      # command would silently operate on "/ghmanage-signing.keychain-db".
      # Steps use $RUNNER_TEMP, which the shell always has.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirm runner architecture
        run: |
          echo "arch:  $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: expected an Apple Silicon runner (arm64), got $(uname -m)."
            echo "       An x86_64 build would be published under an Apple Silicon"
            echo "       filename and fail to launch for everyone who downloads it."
            exit 1
          fi

      # As on Windows, before anything is built or signed. These include the
      # tests that only mean something here, such as tests/test_mac_labels.py
      # reading each control's label back from AppKit (#69). build.sh makes
      # its own environment, so installing here doesn't change the build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install "pytest>=8,<10"
          python -m pytest -q -rs
          # Named one by one, so the log shows the AppKit label checks ran
          # here rather than being skipped. They take under a second.
          python -m pytest -v tests/test_mac_labels.py

      - name: Verify tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python -c "from version import __version__; print(__version__)")
          echo "tag=$tag version.py=$app"
          if [ "$tag" != "$app" ]; then
            echo "ERROR: Tag v$tag does not match version.py ($app). Bump version.py and re-tag."
            exit 1
          fi

      # ── Signing material ────────────────────────────────────────────────
      # The certificates go into a throwaway keychain in RUNNER_TEMP, never the
      # login keychain, and the keychain is deleted at the end of the job
      # regardless of outcome.
      - name: Import Developer ID certificates
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ghmanage-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Default keychains auto-lock after 5 minutes, which would break a
          # build partway through. 6 hours comfortably outlives the job.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_cert() {
            local b64="$1" pass="$2" label="$3"
            [ -n "$b64" ] || { echo "No $label certificate provided; skipping."; return; }
            local path="$RUNNER_TEMP/$label.p12"
            echo "$b64" | base64 --decode > "$path"
            security import "$path" -k "$KEYCHAIN_PATH" -P "$pass" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$path"
            echo "Imported $label certificate."
          }

          import_cert "$CERT_P12" "$CERT_PASSWORD" "application"
          # The installer certificate is a separate Apple product from the
          # application one. Without it the .pkg is built unsigned (Velopack
          # degrades gracefully) and macOS will refuse to open it — which is
          # why the DMG is also published, and why this is only a warning.
          import_cert "$INSTALLER_P12" "${INSTALLER_PASSWORD:-$CERT_PASSWORD}" "installer"
          if [ -z "$INSTALLER_P12" ]; then
            echo "::warning::MACOS_INSTALLER_P12 not set - the .pkg will be UNSIGNED. Users should install from the DMG."
          fi

          # Without this, codesign triggers a GUI authorization prompt that
          # nothing can answer on a headless runner, and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "Identities available for signing:"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Write notarization API key
        if: env.MACOS_NOTARIZE_ENABLED == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "Notarization key written."

      # ── Build ───────────────────────────────────────────────────────────
      # On non-tag runs this builds the .app only, matching the Windows job:
      # packaging needs vpk and signing credentials, and a PR does not need a
      # shippable installer to prove the build works.
      - name: Build application
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./build.sh

      # The macOS runner has a `dotnet` CLI new enough to *install* a tool but no
      # runtime the installed tool can then run on: vpk's apphost targets
      # net10.0 and reports ".NET location: Not found", DOTNET_ROOT unset, and
      # exits 131. setup-dotnet installs the runtime and exports DOTNET_ROOT, so
      # the shim resolves. The Windows job needs none of this — its image
      # registers .NET properly — which is why the two jobs differ here.
      - name: Set up .NET
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      # Fetch the previous release's packages so vpk can build a delta against
      # them. Expected to fail on the very first macOS release, which has no
      # predecessor in the osx channel.
      - name: Download previous release packages
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/TheIdeaPlace/GHManage
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel osx
          --outputDir installer/Releases

      # As on Windows: the relay's address and key for Report a Bug, in
      # releases only, and a release without them fails.
      - name: Write bug-report relay config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPKIT_RELAY_URL: ${{ vars.APPKIT_RELAY_URL }}
          APPKIT_RELAY_KEY: ${{ secrets.APPKIT_RELAY_KEY }}
        run: python scripts/write_relay_config.py

      - name: Build, sign, pack and notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHM_SIGN_CODE: ${{ env.MACOS_SIGNING_ENABLED == 'true' && '1' || '0' }}
          GHM_NOTARIZE: ${{ env.MACOS_NOTARIZE_ENABLED == 'true' && '1' || '0' }}
          # Quoted: the identity contains ": ", which YAML would otherwise read
          # as a nested mapping key and reject the whole file.
          GHM_SIGNING_IDENTITY: "${{ secrets.MACOS_SIGNING_IDENTITY || 'Developer ID Application: Kelly Ford (P887QF74N8)' }}"
          GHM_INSTALLER_IDENTITY: "${{ secrets.MACOS_INSTALLER_IDENTITY || 'Developer ID Installer: Kelly Ford (P887QF74N8)' }}"
          GHM_KEYCHAIN: ${{ runner.temp }}/ghmanage-signing.keychain-db
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ "$GHM_SIGN_CODE" != "1" ]; then
            echo "::warning::macOS signing secrets not set - producing an UNSIGNED build. macOS will refuse to open it after download."
          fi
          # GHM_INSTALLER_IDENTITY has a default, but the certificate behind it
          # may not have been imported. Passing an identity that is not in the
          # keychain makes vpk fail rather than fall back, so clear it.
          if ! security find-identity -v "$GHM_KEYCHAIN" 2>/dev/null | grep -q "Developer ID Installer"; then
            echo "No Developer ID Installer identity present; the .pkg will be unsigned."
            export GHM_INSTALLER_IDENTITY=""
          fi
          ./build.sh installer

      # ── Verification ────────────────────────────────────────────────────
      # The last place a broken bundle can go unnoticed. A .app missing
      # UpdateMac installs and runs perfectly and simply never updates again.
      - name: Verify the packaged app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify"
          rm -rf "$WORK" && mkdir -p "$WORK"
          ditto -x -k installer/Releases/GHManage-osx-Portable.zip "$WORK"
          APP="$WORK/GHManage.app"

          test -d "$APP"
          test -x "$APP/Contents/MacOS/GHManage"
          test -f "$APP/Contents/MacOS/UpdateMac"   # Velopack updater
          test -e "$APP/Contents/MacOS/sq.version"  # Velopack manifest

          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "arch: $(lipo -archs "$APP/Contents/MacOS/GHManage")"
          echo "--- signature ---"
          codesign -dvv "$APP" 2>&1 || true
          # An ad-hoc signature does not pass strict verification; that is
          # expected until the Developer ID secrets exist, so do not fail here.
          codesign --verify --strict --verbose=2 "$APP" 2>&1 || \
            echo "NOTE: signature did not pass strict verify (expected for an unsigned build)"

      # Gatekeeper's verdict on a machine that has never seen this app. This is
      # the check that actually predicts what a user downloading it sees.
      - name: Assess with Gatekeeper
        if: startsWith(github.ref, 'refs/tags/v') && env.MACOS_NOTARIZE_ENABLED == 'true'
        run: |
          set -euo pipefail
          spctl --assess --type open --context context:primary-signature -v installer/Releases/GHManage-osx.dmg
          xcrun stapler validate installer/Releases/GHManage-osx.dmg
          echo "Gatekeeper accepts the DMG."

      - name: Verify the DMG mounts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          DMG=installer/Releases/GHManage-osx.dmg
          hdiutil verify "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          ls -la "$MNT"
          test -d "$MNT/GHManage.app"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT"
          echo "DMG contents verified."

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghmanage-osx-arm64
          path: dist/GHManage.app/**
          if-no-files-found: error
          retention-days: 7

      # The .pkg `vpk pack` produces is deliberately not published. Signing it
      # needs a Developer ID *Installer* certificate — a separate Apple product
      # from the application one — and without that macOS refuses to open it.
      # The DMG is the documented way to install, the portable zip covers the
      # rest, and both self-update identically, so a third install path was not
      # worth a second certificate. Add the file back here if that cert ever
      # exists; MACOS_INSTALLER_P12 already wires it up.
      #
      # Explicit file list, not the whole directory. `vpk pack` also writes the
      # legacy Squirrel `RELEASES` file, whose name carries no channel — the
      # Windows job publishes one too, and a same-named asset uploaded second
      # replaces the first. Publishing the macOS copy would overwrite the
      # Windows feed's legacy index. The modern client reads
      # releases.osx.json / releases.win.json, so the macOS RELEASES is simply
      # not published.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            installer/Releases/GHManage-osx-Portable.zip
            installer/Releases/GHManage-osx.dmg
            installer/Releases/*-osx-full.nupkg
            installer/Releases/*-osx-delta.nupkg
            installer/Releases/releases.osx.json
            installer/Releases/assets.osx.json
          if-no-files-found: error
          retention-days: 7

      # Runs even when the build fails, so a signing key never outlives the job.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP"/*.p12 || true
          security delete-keychain "$RUNNER_TEMP/ghmanage-signing.keychain-db" 2>/dev/null || true
          echo "Signing material removed."

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-logs
          path: build/**/warn-*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════
  #  Release
  # ══════════════════════════════════════════════════════════════════════
  #
  # Both build jobs must succeed. That is the point of the split: a tag either
  # publishes Windows and macOS together, or publishes nothing. A half release
  # is worse than a failed one, because the missing platform's users see a new
  # version they cannot get and the updater on that platform has nothing to
  # resolve.
  # ══════════════════════════════════════════════════════════════════════
  #  User guide — built on every run, published only after a release
  # ══════════════════════════════════════════════════════════════════════
  # Builds the whole site exactly as publish-user-guide.yml does, without
  # deploying. The build fails on a pandoc warning, a link to a heading that
  # does not exist, or a broken link between pages, so a guide edit that would
  # break publishing fails its pull request instead of the release. The tests
  # that need pandoc skip on the build jobs, which have none; here they run.
  check-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release history reads every tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pandoc and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install pytest

      - name: Build the site
        run: python scripts/build_user_guide.py --out build/docs --version 0.0.0 --repo-root .

      - name: Guide tests
        run: python -m pytest -q -rs tests/test_build_user_guide.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # check-guide too: a guide that cannot be built must stop the release
    # before it is public, not fail the publish step after it.
    needs: [build-windows, build-macos, check-guide]
    runs-on: ubuntu-latest

    steps:
      # Needed only for docs/release-notes-<tag>.md, which is the release body.
      # It also drops the repo's own assets/ directory into the workspace, which
      # is why the downloads below land in release-assets/ and NOT assets/. When
      # they shared a name, `files: assets/*` published ghmanage.icns,
      # make_icon.py and the entitlements file alongside the real downloads —
      # v0.7.1 shipped that way. The directory must stay distinct from every
      # path in the repository.
      - uses: actions/checkout@v7

      - name: Download Windows assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-assets

      - name: Download macOS assets
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: release-assets

      # Guards the collision above from coming back by any other route: these
      # are exactly the files a release may carry, so anything else appearing in
      # the directory fails the job before it can be published.
      - name: List assets
        run: |
          ls -la release-assets
          unexpected=$(ls release-assets | grep -vE '^(GHManage-win-Setup\.exe|GHManage-win-Portable\.zip|GHManage-osx\.dmg|GHManage-osx-Portable\.zip|.*\.nupkg|RELEASES|releases\.(win|osx)\.json|assets\.(win|osx)\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected files staged for the release:"
            echo "$unexpected"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: GHManage ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: docs/release-notes-${{ github.ref_name }}.md

  # Publish the user guide and release history to GitHub Pages once the
  # release is out. Called here rather than triggered by the release event:
  # a release created with GITHUB_TOKEN raises no event that starts a workflow.
  # A called workflow's jobs cannot have more permission than the job calling
  # it, and this workflow's top level grants neither pages nor a read-only
  # contents, so the job sets exactly what publish-user-guide.yml needs.
  publish-guide:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-user-guide.yml

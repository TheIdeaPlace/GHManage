PackageIdentifier: TheIdeaPlace.GHManage
PackageVersion: <VERSION>
PackageLocale: en-US
# The same name Add/Remove Programs shows (ghmanage.yml's --packAuthors).
Publisher: Kelly Ford
PublisherUrl: https://theideaplace.net/projects/
PublisherSupportUrl: https://github.com/TheIdeaPlace/GHManage/issues
PackageName: GHManage
PackageUrl: https://theideaplace.net/ghmanage/
License: MIT
LicenseUrl: https://github.com/TheIdeaPlace/GHManage/blob/main/LICENSE
Copyright: Copyright (c) 2026 kellylford
ShortDescription: A keyboard-first desktop app for GitHub issues, pull requests, notifications and repositories.
Description: |-
  GHManage is a desktop app for working with GitHub from the keyboard, built to read well
  with a screen reader. Browse issues, pull requests, notifications, branches, commits,
  releases, workflow runs, discussions, security alerts and more across your repositories,
  read changed files and code as text, and comment, review and merge without a browser.
  It works through the GitHub CLI (gh), which winget installs with it if it is missing.
  GHManage itself installs per user without administrator rights and keeps itself up to date.
Moniker: ghmanage
Tags:
- accessibility
- gh
- github
- issues
- keyboard
- notifications
- pull-requests
- screen-reader

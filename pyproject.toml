[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghviewer"
# Read from version.py so the app, the installer and CI share one version.
dynamic = ["version"]
description = "A wxPython GUI viewer and manager for GitHub issues and pull requests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kelly Ford" }]
dependencies = [
    "wxPython>=4.2.0",
    "velopack",
    "theideaplace-appkit @ https://github.com/TheIdeaPlace/app-kit/archive/ac6f9598cec32a8a89fa8af03a8192cd586dd5bc.zip#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "build>=1.0",
    "pytest>=8.0",
]

[project.scripts]
ghviewer = "ghviewer:main"

[tool.setuptools]
py-modules = ["ghviewer", "gh_data", "updater", "version", "favorites", "pinned_repos", "saved_searches",
              "commands", "search_help", "columns", "gh_columns", "settings",
              "announce", "speech", "diffview", "codeview", "alertview", "bugreport",
              "discussionview", "gistview", "insightview", "milestoneview", "peopleview"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.pyinstaller]
# Build a standalone .exe with:  pyinstaller --noconsole --name ghviewer ghviewer.py

[tool.pytest.ini_options]
testpaths = ["tests"]

# Test coverage settings, for the weekly Coverage workflow (#135) and for
# `pytest --cov` by hand. The app is flat modules at the repository root, so
# the root is measured and everything that isn't the app is left out.
# relative_files lets the Windows and macOS runs combine into one report.
# Every measured module is at the root, so their names already agree. A
# package folder, if the app gains one, needs its two spellings added to
# [paths] ("pkg/" and "pkg\\"), or Windows' backslash names for its files
# won't combine with macOS's.
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    "assets/*",
    "build/*",
    "dist/*",
    ".venv/*",
    ".claude/*",
    "_relay_config.py",
]
branch = true
relative_files = true

[tool.coverage.paths]
source = [
    "./",
    ".\\",
]
